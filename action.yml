name: Cypress Run
description: Runs Cypress specs and uploads their results as artifacts

inputs:
  cache-path:
    description: 'path of the cypress cache'
    default: ".cache/Cypress"

  browser:
    description: "type of browser (chrome by default; electron is also available)"
    default: "chrome"

  spec:
    required: true
    description: "Cypress spec to execute"

  tags:
    description: "Comma-separated test tags (exported as CYPRESS_TEST_TAGS)"
    default: "regression"

runs:
  using: composite
  steps:  
    - name: Extract branch name
      shell: bash
      run: echo "branch=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
      id: extract_branch

    - name: Get Repository
      uses: actions/checkout@v7

    - name: Restore Node Modules Cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-v1-${{ steps.extract_branch.outputs.branch }}-${{ hashFiles('yarn.lock') }}

    - name: Restore Cypress Cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cache-path }}
        key: cypress-v1-${{ steps.extract_branch.outputs.branch }}-${{ hashFiles('yarn.lock') }}

    - name: Generate Upload Artifact Name
      shell: bash
      # base64 single-line (no 76-col wrap) and artifact-name-safe (no '/', '+' or '=')
      run: echo "name=cypress-$(printf '%s' '${{ inputs.spec }}' | base64 | tr -d '\n=' | tr '/+' '_-')" >> $GITHUB_OUTPUT
      id: artifact_name

    - name: run-cypress-tests
      shell: bash
      env:
        CYPRESS_CACHE_FOLDER: "${{ inputs.cache-path }}"
      id: tests
      run: CYPRESS_TEST_TAGS="${{ inputs.tags }}" npx cypress run --browser ${{ inputs.browser }} --spec "${{ inputs.spec }}"

    - name: archive-production-artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: |
          ./cypress/screenshots
          ./cypress/videos
          ./cypress/results
        retention-days: 2